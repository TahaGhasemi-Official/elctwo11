<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کتاب طراحی و نصب تاسیسات جریان ضعیف | آموزش کامل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-orbs"><span></span><span></span><span></span></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">⚡</div>
    <div>
      <div class="brand-title">کتاب طراحی و نصب تاسیسات جریان ضعیف</div>
      <div class="brand-sub">رشته الکتروتکنیک – پایه یازدهم</div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="lessonName">—</span>
      <span class="pct" id="lessonPct">۰٪</span>
    </div>
    <div class="bar"><div class="bar-fill" id="lessonBar"></div></div>
    <div class="progress-info small">
      <span>پیشرفت کل دوره</span>
      <span class="pct" id="totalPct">۰٪</span>
    </div>
    <div class="bar thin"><div class="bar-fill total" id="totalBar"></div></div>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <div class="slide-head">
      <div class="unit" id="unitName">—</div>
      <h1 id="lessonTitle">—</h1>
      <div class="slide-counter" id="slideCounter"></div>
    </div>
    <section class="slide" id="slide"></section>
    <div class="controls">
      <button class="btn ghost" id="nextBtn">بعدی ←</button>
      <div class="dots" id="dots"></div>
      <button class="btn ghost" id="prevBtn">→ قبلی</button>
    </div>
  </main>
</div>

<footer class="footer">
  <div class="footer-line"></div>
  <p>طراحی شده و قدرت گرفته از <strong>طاها قاسمی</strong></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
